name: Verify algorithms
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Node algorithm tests
        run: node --test tests/probing.test.cjs
      - name: Java implementation and smoke test
        run: |
          javac src/ProbingStrategies.java
          java -cp src ProbingStrategies
